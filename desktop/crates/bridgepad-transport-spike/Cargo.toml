[package]
name = "bridgepad-transport-spike"
description = "Local transport measurements for BridgePad architecture decisions"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bridgepad-media = { path = "../bridgepad-media" }
bridgepad-media-protocol = { path = "../bridgepad-media-protocol" }
quinn = "=0.11.12"
rcgen = "0.14.10"
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
