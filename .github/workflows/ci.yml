name: Android CI

on:
  push:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

  notify-failure:
    name: Email failure notification
    runs-on: ubuntu-latest
    needs:
      - tests
      - build
    if: ${{ always() && (needs.tests.result == 'failure' || needs.build.result == 'failure') }}
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          subject: "BridgePad CI failed: ${{ github.ref_name }}"
          body: |
            One or more BridgePad CI checks failed.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Tests and lint: ${{ needs.tests.result }}
            Build: ${{ needs.build.result }}
            Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
