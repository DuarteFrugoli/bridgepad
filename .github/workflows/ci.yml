name: Android CI

on:
  push:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and lint
        run: ./gradlew :domain:test :protocol:test :transport-network:test :transport-bluetooth-hid:testDebugUnitTest :transport-bluetooth-hid:lintDebug :transport-bluetooth-desktop:testDebugUnitTest :transport-bluetooth-desktop:lintDebug :app:testDebugUnitTest :app:lintDebug

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

  desktop-tests:
    name: Desktop workspace tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Test desktop workspace
        run: cargo test --locked --manifest-path desktop/Cargo.toml

  desktop-build:
    name: Build desktop receiver (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: bridgepad-desktop-windows
            packages: -p bridgepad-desktop -p bridgepad-daemon -p bridgepad-gamepad-spike -p bridgepad-bluetooth-spike
            binary: |
              desktop/target/release/bridgepad-desktop.exe
              desktop/target/release/bridgepad-daemon.exe
              desktop/target/release/bridgepad-gamepad-spike.exe
              desktop/target/release/bridgepad-bluetooth-spike.exe
          - name: Linux
            os: ubuntu-latest
            artifact: bridgepad-desktop-linux
            packages: -p bridgepad-daemon
            binary: desktop/target/release/bridgepad-daemon
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Build desktop receiver
        run: cargo build --locked --release --manifest-path desktop/Cargo.toml ${{ matrix.packages }}

      - name: Upload desktop receiver
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
